<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>關卡進度設定 - 按序停車</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; }
    body { background: #1c2226; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #283036; width: 100%; max-width: 400px; border-radius: 20px; padding: 28px 24px; box-shadow: 0 12px 32px rgba(0,0,0,0.45); text-align: center; }
    .icon-circle { width: 64px; height: 64px; background: #f58231; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 16px; font-size: 30px; box-shadow: 0 4px 14px rgba(245,130,49,0.4); }
    h1 { font-size: 22px; margin-bottom: 8px; color: #fff; }
    p.desc { font-size: 14px; color: #9aa5b1; margin-bottom: 24px; }
    .status-box { background: #1c2226; border-radius: 12px; padding: 14px; margin-bottom: 20px; border: 1px solid #38424b; }
    .status-label { font-size: 13px; color: #9aa5b1; margin-bottom: 4px; }
    .status-val { font-size: 32px; font-weight: 800; color: #f58231; word-break: break-all; }
    .input-group { text-align: left; margin-bottom: 16px; }
    .input-group label { display: block; font-size: 14px; color: #cbd2d9; margin-bottom: 8px; }
    .input-group input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 2px solid #3e4c59; background: #1c2226; color: #fff; font-size: 18px; font-weight: bold; text-align: center; outline: none; transition: border-color 0.2s; }
    .input-group input:focus { border-color: #f58231; }
    .preset-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 22px; }
    .preset-btn { background: #38424b; color: #e4e7eb; border: none; padding: 8px 4px; border-radius: 8px; font-size: 12px; cursor: pointer; transition: background 0.2s; }
    .preset-btn:hover { background: #4b5864; }
    .btn-primary { width: 100%; background: #f58231; color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 12px; box-shadow: 0 4px 12px rgba(245,130,49,0.35); transition: transform 0.1s, background 0.2s; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary { width: 100%; background: transparent; color: #9aa5b1; border: 1px solid #4b5864; padding: 12px; border-radius: 12px; font-size: 15px; cursor: pointer; text-decoration: none; display: inline-block; }
    .toast { font-size: 14px; color: #4ade80; min-height: 20px; margin-bottom: 12px; opacity: 0; transition: opacity 0.25s; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-circle">🚗</div>
    <h1>關卡進度設定</h1>
    <p class="desc">設定《按序停車》目前已突破的關卡數</p>

    <div class="status-box">
      <div class="status-label">目前儲存的關卡進度</div>
      <div class="status-val" id="currentLvDisplay">1</div>
    </div>

    <div class="input-group">
      <label for="lvInput">輸入目標關卡 (1 ~ 1,000,000)：</label>
      <input type="number" id="lvInput" min="1" max="1000000" value="1">
    </div>

    <div class="preset-row">
      <button class="preset-btn" onclick="setVal(1)">第 1 關</button>
      <button class="preset-btn" onclick="setVal(100)">第 100 關</button>
      <button class="preset-btn" onclick="setVal(10000)">第 1 萬關</button>
      <button class="preset-btn" onclick="setVal(1000000)">第 100 萬關</button>
    </div>

    <div class="toast" id="toastMsg">✅ 已成功儲存關卡進度！</div>

    <button class="btn-primary" onclick="saveLevel()">儲存並返回遊戲</button>
    <a href="index.html" class="btn-secondary">取消並返回遊戲</a>
  </div>

  <script>
    const STORAGE_KEY = "Parking_3";
    const HIGH_SCORE_KEY = "HigScore_JiaoTong";
    const MAX_LEVEL = 1000000;

    function loadCurrentLevel() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const data = raw ? JSON.parse(raw) : { gameMaxScore: 1 };
        const lv = parseInt(data.gameMaxScore, 10) || 1;
        document.getElementById("currentLvDisplay").textContent = lv.toLocaleString();
        document.getElementById("lvInput").value = lv;
      } catch (e) {
        document.getElementById("currentLvDisplay").textContent = 1;
      }
    }

    function setVal(num) {
      document.getElementById("lvInput").value = num;
    }

    function saveLevel() {
      let lv = parseInt(document.getElementById("lvInput").value, 10);
      if (isNaN(lv) || lv < 1) lv = 1;
      if (lv > MAX_LEVEL) lv = MAX_LEVEL;

      localStorage.setItem(STORAGE_KEY, JSON.stringify({ gameMaxScore: lv }));
      localStorage.setItem(HIGH_SCORE_KEY, lv);

      document.getElementById("currentLvDisplay").textContent = lv.toLocaleString();
      const toast = document.getElementById("toastMsg");
      toast.classList.add("show");

      setTimeout(() => {
        window.location.href = "index.html";
      }, 500);
    }

    loadCurrentLevel();
  </script>
</body>
</html>
