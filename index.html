<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>小遊戲：按序停車</title>

  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1"/>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="msapplication-tap-highlight" content="no">

  <meta name="full-screen" content="yes"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true"/>
  <meta name="screen-orientation" content=""/>
  <meta name="x5-orientation" content="">
  <meta name="x5-page-mode" content="app">

  <link rel="stylesheet" type="text/css" href="style-mobile.css"/>
</head>
<body style="margin: 0; background: #9ed87e; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw;">
  
  <!-- max-width: 56.25vh 確保寬度永遠不會超過高度的 9/16 比例 -->
  <div id="canvasDiv" style="position: relative; width: 100vw; height: 100vh; max-width: 56.25vh; display: flex; justify-content: center; align-items: center;">
    <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0" style="width: 100%; height: 100%;"></canvas>
    <div id="block-Box" style="display:none;width:100%;height:100%;position:absolute;top:0;left:0;"></div>
  </div>

  <div id="loadingText" style="width:100%;display:none;text-align:center;position:absolute;top:45%;z-index:2;font-size:20px;color:#f99f0a">
    loading......0%
  </div>

  <div id="splash"></div>

  <div id="loadingImg" style="top:45%;width:100%;position:absolute;">
    <img src="res/loading.gif" width="7%" height="7%" />
  </div>

  <script type="text/javascript">
    var preloader;
    var adCompleteFlag = true;
    var resCompleteFlag = true;
    var adEndComplete = true;
    var resEndComplete = false;
    window.adsbygoogle = window.adsbygoogle || [];
    const adBreak = function(o) {};

    judgeLanTitle();
    function judgeLanTitle() {
      if (window.navigator.language == "zh-CN" || window.navigator.language == "zh-cn") {
        document.title = "小游戏：按序停车";
      } else if (window.navigator.language == "zh-TW" || window.navigator.language == "zh-HK") {
        document.title = "小遊戲：按序停車";
      } else if (window.navigator.language == "ko-KR") {
        document.title = "미니 게임 : 주문 주차";
      } else if (window.navigator.language == "ja-JP") {
        document.title = "ミニゲーム：駐車場を注文する";
      } else if (window.navigator.language == "th-TH") {
        document.title = "มินิเกม : สั่งที่จอดรถ";
      } else {
        document.title = "Mini game: Order Parking";
      }
    }

    var loadintT = document.getElementById("loadingText");
    var loadintGif = document.getElementById("loadingImg");
    setTimeout(function () {
      if (loadintGif) loadintGif.remove();
      if (loadintT) loadintT.style.display = "";
      updateLabView(0.1);
    }, 1000);

    window.timer = null;
    window.tempSeconds = 1;
    window.loadData = {
      completedCount: 0,
      totalCount: 0
    };

    window.onload = function() {
      var blockBox = document.getElementById("block-Box");
      if(blockBox) blockBox.style.display = "none";
    };

    function updateLabView(t) {
      if (timer != null) {
        clearInterval(timer);
      }
      timer = setInterval(function () {
        tempSeconds++;
        actualTotal();
        var loadintT = document.getElementById("loadingText");
        if (!loadintT) {
          clearInterval(timer);
          return;
        }

        loadintT.innerHTML = 'loading......' + parseInt(tempSeconds) + '%';

        switch (tempSeconds) {
          case 20: updateLabView(0.2); break;
          case 40: updateLabView(0.3); break;
          case 60: updateLabView(0.4); break;
          case 96: updateLabView(5); break;
          case 97: updateLabView(10); break;
          case 98: updateLabView(50); break;
          case 99: updateLabView(100); break;
          default:
            if (tempSeconds >= 80 && tempSeconds < 96) {
              updateLabView(t + 0.1);
            }
            break;
        }
        if (tempSeconds > 100) {
          clearInterval(timer);
          tempSeconds = 100;
          loadintT.innerHTML = 'loading......' + parseInt(tempSeconds) + '%';
        }
      }, t * 1000);
    }

    function actualTotal() {
      var percent = parseInt(100 * loadData.completedCount / loadData.totalCount);
      if (percent > tempSeconds && loadData.totalCount > 1) {
        tempSeconds = percent;
      }
    }
  </script>

  <script src="src/settings.js" charset="utf-8"></script>
  <script src="main.js" charset="utf-8"></script>

  <script type="text/javascript">
    (function () {
      if (typeof VConsole !== 'undefined') {
        window.vConsole = new VConsole();
      }

      var splash = document.getElementById('splash');
      if(splash) splash.style.display = 'block';

      var cocos2d = document.createElement('script');
      cocos2d.async = true;
      cocos2d.src = window._CCSettings.debug ? 'cocos2d-js.js' : 'cocos2d-js-min.js';

      var engineLoaded = function () {
        document.body.removeChild(cocos2d);
        cocos2d.removeEventListener('load', engineLoaded, false);
        window.boot();
      };
      cocos2d.addEventListener('load', engineLoaded, false);
      document.body.appendChild(cocos2d);
    })();
  </script>
</body>
</html>
